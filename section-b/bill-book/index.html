<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>Bill Book</title><link rel="stylesheet" href="style.css"></head><body><header><h1 id="shopTitle">My Shop</h1><p>Simple offline billing</p></header><main><section class="panel"><h2>Shop profile</h2><input id="shop" placeholder="Shop name"><input id="upi" placeholder="UPI ID (example@upi)"><button id="saveShop">Save profile</button></section><section class="panel"><h2>New bill</h2><div class="row"><input id="item" placeholder="Item name"><input id="price" type="number" min="0" placeholder="Price ₹"><input id="qty" type="number" min="1" value="1" placeholder="Qty"><button id="add">Add item</button></div><div id="items"></div><div class="row"><label>Discount ₹ <input id="discount" type="number" min="0" value="0"></label><label>Tax % <input id="tax" type="number" min="0" value="0"></label></div><h2 id="total">Total: ₹0.00</h2><div id="qr"></div><button id="make">Save bill</button><button id="share">Share / Print bill</button></section><section class="panel"><h2>Bill history</h2><p id="daily"></p><div id="history"></div></section></main><script src="app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
